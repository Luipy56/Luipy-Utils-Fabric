plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven { url = 'https://maven.shedaniel.me/' }
	maven { url = 'https://maven.terraformersmc.com/releases/' }
	// Mod Menu 9.x depends on eu.pb4:placeholder-api (not on Maven Central).
	maven { url = 'https://maven.nucleoid.xyz/' }
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/luipy-utils-mod.accesswidener")

	mods {
		"luipy-utils-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

/**
 * Dedicated servers have no "allow cheats": operators are required for /gamemode etc.
 * Fabric runClient assigns {@code Player###} names; we pre-op those plus anyone in {@code run/usercache.json}.
 */
tasks.register('prepareDevRunServer') {
	group = 'fabric'
	description = 'Writes run/ops.json and dev-friendly server.properties keys before runServer.'
	doLast {
		def runDir = file('run')
		runDir.mkdirs()

		def byName = new LinkedHashMap<String, Map>()
		def usercacheFile = new File(runDir, 'usercache.json')
		if (usercacheFile.exists()) {
			try {
				def parsed = new groovy.json.JsonSlurper().parse(usercacheFile)
				if (parsed instanceof List) {
					parsed.each { e ->
						byName[e.name as String] = [
							uuid               : e.uuid as String,
							name               : e.name as String,
							level              : 4,
							bypassesPlayerLimit: false
						]
					}
				}
			} catch (Exception ignored) {
			}
		}
		for (int i = 0; i < 1000; i++) {
			String name = "Player${i}"
			if (!byName.containsKey(name)) {
				String uuid = java.util.UUID.nameUUIDFromBytes(
					("OfflinePlayer:" + name).getBytes(java.nio.charset.StandardCharsets.UTF_8)
				).toString()
				byName[name] = [
					uuid               : uuid,
					name               : name,
					level              : 4,
					bypassesPlayerLimit: false
				]
			}
		}
		new File(runDir, 'ops.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(byName.values()))

		def propsFile = new File(runDir, 'server.properties')
		if (propsFile.exists()) {
			def lines = propsFile.readLines()
			def overrides = [
				'allow-flight' : 'true',
				'gamemode'     : 'creative',
				'online-mode'  : 'false'
			]
			def keysSeen = new HashSet<String>()
			def out = new StringBuilder()
			lines.each { line ->
				def idx = line.indexOf('=')
				if (idx > 0) {
					def key = line.substring(0, idx).trim()
					if (overrides.containsKey(key)) {
						out.append(key).append('=').append(overrides[key]).append('\n')
						keysSeen.add(key)
						return
					}
				}
				out.append(line).append('\n')
			}
			overrides.each { key, val ->
				if (!keysSeen.contains(key)) {
					out.append(key).append('=').append(val).append('\n')
				}
			}
			propsFile.text = out.toString()
		}
	}
}

afterEvaluate {
	def prep = tasks.findByName('prepareDevRunServer')
	def run = tasks.findByName('runServer')
	if (prep != null && run != null) {
		run.dependsOn(prep)
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

test {
	useJUnitPlatform()
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
