# Full JDK 17+ for Gradle and compilation (use a JDK, not a JRE-only runtime).
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# Done to increase the memory available to gradle.
# Prefer IPv4 for Maven downloads if IPv6 is broken or has no default route (common home-router issue).
org.gradle.jvmargs=-Xmx1G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Maven (Loom downloads intermediary etc. from here). If https://maven.fabricmc.net is unreachable
# on your PC, try a public mirror (same path layout), then ./gradlew --stop && ./gradlew runClient
# fabric_maven_url=https://fabric.fastmcmirror.org/
# fabric_maven_url=https://alexiil.uk/mirrors/maven.fabricmc.net/maven/

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
loader_version=0.16.10
# Loom 1.16+ requires JVM 21 for Gradle. This repo uses Loom 1.6.x + Gradle 8.7 for a JDK 17-only setup.
loom_version=1.6.11

# Mod Properties
mod_version=0.1.25
maven_group=com.luipy
archives_base_name=luipy-utils-mod

# Dependencies
fabric_api_version=0.92.6+1.20.1
cloth_config_version=11.1.118
modmenu_version=7.2.2
